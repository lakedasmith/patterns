<b>STRIPES</b><br>
(main color)<br>
sc at sm down sides through small and big holes. <b>Change colors.</b></label><br>
<input type="checkbox" id="todo"><label for="todo">Row 1: sc in each sc</label><br>
<input type="checkbox" id="todo"><label for="todo">Row 2: sc across. <b>Change colors</b></label><br>
<input type="checkbox" id="todo"><label for="todo">Row 3: sc across</label><br>
repeat for other side, starting at bottom, ending at sm<br><br>

<b>BACK</b><br>
Repeat <b>FRONT</b> without Neck, (54 rows ending with 43 sts)<br>
<input type="checkbox" id="todo"><label for="todo"><b>Row 55:</b> 7 dc, dc2tog (8) / 5 dc, dc2tog (6)</label><br>
<input type="checkbox" id="todo"><label for="todo"><b>(other side) Row 55:</b> dc2tog, 7dc / dc2tog, 5 dc (6)</label><br><br>

Repeat <b>STRIPES</b><br><br>

<b>JOINING</b><br>
with <b>smaller hook</b> and WS facing join at shoulders with sc. With RS facing, join at hemline 
with ss.<br><br>

<b>SLEEVES</b><br>
with <b>bigger hook</b> and main color (secondary color)<br>
Ch 1, sc around the sleeves. Finish with ss and <u>change colors</u>.<br>
<input type="checkbox" id="todo"><label for="todo">Row 1: sc2tog, sc until last 2 sts, sc2tog, ss to 1st st. Ch 1, turn</label><br>
<input type="checkbox" id="todo"><label for="todo">Row 2: sc2tog, sc until last 2 sts, sc2tog, ss to 1st st. <b>Change to main.</b> Ch 1, turn</label><br>
<input type="checkbox" id="todo"><label for="todo">Row 3-5: sc2tog, sc until last 2 sts, sc2tog, ss to 1st st. </u>Change colors.</u> Ch 1, turn</label><br>
<input type="checkbox" id="todo"><label for="todo">Row 6-7: sc2tog, sc until last 2 sts, sc2tog, ss to 1st st and cut.<br>
Repeat for other side</label><br><br>

setup row | <b>1 2</b> |  3 4 5 |  <b>6 7</b><br>

	<br><br>

<b>NECK FRONT</b><br>
with main color<br>
Sc around, finish with ss and change colors. Ch 1<br>

<input type="checkbox" id="todo"><label for="todo"><b>Round 3:</b> sc inc, sc around, sc inc in last sts. Ch 1 and FO. Sew together.</label><br><br><br>
